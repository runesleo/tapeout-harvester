[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapeout-harvester"
version = "0.1.0rc3"
description = "Fail-closed TapeOut reward harvester with optional BEM swap and local signing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "web3>=7.12,<8",
  "eth-account>=0.13.7,<0.15",
]

[project.optional-dependencies]
keyring = ["keyring>=25,<26"]
dev = ["build>=1,<2", "pytest>=8,<10"]

[project.scripts]
tapeout-harvester = "tapeout_harvester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
